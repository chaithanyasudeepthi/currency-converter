<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Currency Converter</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand bg-white border-bottom app-navbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="/">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 0 0-15.5-6.2L3 8" />
          <path d="M3 3v5h5" />
          <path d="M3 12a9 9 0 0 0 15.5 6.2L21 16" />
          <path d="M16 16h5v5" />
          <path d="M14.5 9.5c-.5-.8-1.4-1.2-2.5-1.2-1.4 0-2.4.7-2.4 1.8 0 2.4 5 1.2 5 3.6 0 1.1-1.1 1.8-2.6 1.8-1.2 0-2.2-.5-2.7-1.3M12 7v1.3M12 15.2V17" />
        </svg>
        <span class="brand-text">Currency Converter</span>
      </a>
      <ul class="navbar-nav ms-auto flex-row gap-3 gap-md-4">
        <li class="nav-item"><a class="nav-link p-0" href="#" id="popularLink">Popular Rates</a></li>
        <li class="nav-item"><a class="nav-link p-0" href="#" id="statusLink">API Status</a></li>
      </ul>
    </div>
  </nav>

  <main class="container py-4 py-md-5">
    <!-- Hero -->
    <div class="text-center mb-4 mb-md-5">
      <h1 class="hero-title">Convert currencies instantly</h1>
      <p class="text-secondary hero-sub mb-0">Your trusted, real-time global exchange companion.</p>
    </div>

    <!-- Converter card -->
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8 col-xl-7">
        <div class="card converter-card">
          <div class="card-body p-3 p-md-4">
            <form id="converterForm" novalidate>
              <!-- Amount -->
              <div class="mb-3">
                <label for="amount" class="form-label fw-medium">Amount</label>
                <div class="input-group has-validation">
                  <span class="input-group-text bg-white" id="amountSymbol">$</span>
                  <input type="text" inputmode="decimal" class="form-control" id="amount" placeholder="1,000.00" autocomplete="off" />
                  <div class="invalid-feedback" id="amountError"></div>
                </div>
              </div>

              <!-- From / swap / To -->
              <div class="currency-row mb-4">
                <div class="flex-fill">
                  <label for="fromCurrency" class="form-label fw-medium">From</label>
                  <select id="fromCurrency" class="form-select"></select>
                </div>

                <button type="button" id="swapBtn" class="btn btn-light swap-btn" title="Swap currencies" aria-label="Swap currencies">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M7 4v16M7 4 3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4" />
                  </svg>
                </button>

                <div class="flex-fill">
                  <label for="toCurrency" class="form-label fw-medium">To</label>
                  <select id="toCurrency" class="form-select"></select>
                </div>
              </div>

              <!-- Request-level error -->
              <div class="alert alert-danger py-2 d-none" id="alertBox" role="alert"></div>

              <button type="submit" class="btn btn-primary w-100 convert-btn" id="convertBtn">
                <span class="spinner-border spinner-border-sm me-2 d-none" id="spinner" aria-hidden="true"></span>
                <span id="convertBtnText">CONVERT</span>
              </button>
            </form>
          </div>

          <!-- Result -->
          <div class="result-section d-none" id="resultSection" aria-live="polite">
            <div class="result-label">Result</div>
            <div class="result-from" id="resultFrom"></div>
            <div class="result-main" id="resultMain"></div>
            <div class="result-rate" id="resultRate"></div>
            <div class="result-updated" id="resultUpdated"></div>
          </div>

          <!-- Loading message -->
          <div class="result-section d-none" id="loadingSection">
            <div class="result-from">Converting, please wait…</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Info modal (Popular Rates / API Status) -->
  <div class="modal fade" id="infoModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="infoModalTitle"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="infoModalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
